# Handle auto-merging PRs coming from Dependabot.
name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  issues: write  # for labels
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The ruleset requires two approvals, and it's not possible to add exceptions for
      # Dependabot, so the policy is implemented this way:
      # groups that merge unattended get both approvals from bots,
      # security-major gets only one and waits for a human to supply the second.
      - name: Decide whether this group merges unattended
        id: policy
        env:
          GROUP: ${{ steps.dependabot-metadata.outputs.dependency-group }}
        run: |
          case "${GROUP}" in
            security-patch-minor|version-patch-minor) unattended=true ;;
            *) unattended=false ;;
          esac
          echo "unattended=${unattended}" >> "$GITHUB_OUTPUT"

      - name: Ensure PR type labels exist
        run: |
          gh label create security-update --repo "${GH_REPO}" --color B60205 --description "Dependabot security update" --force
          gh label create version-update --repo "${GH_REPO}" --color 1D76DB --description "Dependabot version update" --force

      - name: Label grouped security PRs
        if: |
          steps.dependabot-metadata.outputs.dependency-group == 'security-patch-minor' ||
          steps.dependabot-metadata.outputs.dependency-group == 'security-major'
        run: gh pr edit "${PR_URL}" --add-label "security-update"

      - name: Label grouped version PRs
        if: steps.dependabot-metadata.outputs.dependency-group == 'version-patch-minor'
        run: gh pr edit "${PR_URL}" --add-label "version-update"

      - name: Approve as github-actions[bot]
        run: gh pr review --approve "${PR_URL}"

      - name: Approve as ons-srm-bot
        if: steps.policy.outputs.unattended == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ONS_SRM_BOT_TOKEN }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${PR_URL}"
